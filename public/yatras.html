    <style>
        /* 3D Carousel Styling */
        .carousel-container {
            perspective: 1200px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-3d {
            width: 300px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 20s infinite linear;
        }
        .carousel-item {
            position: absolute;
            width: 300px;
            height: 200px;
            border: 4px solid white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        /* Positioning 4 images in a circle */
        .item-1 { transform: rotateY(0deg) translateZ(250px); }
        .item-2 { transform: rotateY(90deg) translateZ(250px); }
        .item-3 { transform: rotateY(180deg) translateZ(250px); }
        .item-4 { transform: rotateY(270deg) translateZ(250px); }

        @keyframes rotate {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
        .carousel-container:hover .carousel-3d { animation-play-state: paused; }
    </style>
</head>
