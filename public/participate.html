<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://cdn.tailwindcss.com"></script>
    <main class="max-w-3xl mx-auto px-4 py-12">
        <h1 class="text-4xl font-bold mb-6">How Can I Participate?</h1>
        <form class="space-y-4 bg-white p-8 shadow rounded">
            <input type="text" placeholder="Full Name" class="w-full p-3 border rounded">
            <select class="w-full p-3 border rounded">
                <option>Volunteer</option>
                <option>Donation</option>
                <option>Sponsorship</option>
            </select>
            <textarea placeholder="Message" class="w-full p-3 border rounded h-32"></textarea>
            <button class="w-full bg-orange-600 text-white py-3 rounded font-bold">Submit Interest</button>
        </form>
    </main>
</body>
</html>
